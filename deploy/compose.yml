name: accesscore

x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: accesscore
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: accesscore
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in deploy/.env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/10-app-role.sh:/docker-entrypoint-initdb.d/10-app-role.sh:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U accesscore -d accesscore']
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    logging: *logging
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD in deploy/.env}
      --appendonly yes
      --maxmemory 128mb
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 5
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: 192m
    logging: *logging
    networks: [internal]

  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?set VAULT_TOKEN in deploy/.env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    mem_limit: 256m
    logging: *logging
    networks: [internal]

  api:
    image: ghcr.io/diegowritescode/accesscore-api:${ACCESSCORE_IMAGE_TAG:?set ACCESSCORE_IMAGE_TAG in deploy/.env}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: '3000'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MIGRATION_DATABASE_URL: postgres://accesscore:${POSTGRES_PASSWORD}@postgres:5432/accesscore
      DATABASE_URL: postgres://accesscore_app:${APP_DB_PASSWORD}@postgres:5432/accesscore
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      SIGNER_DRIVER: vault
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      JWT_ISSUER: https://${API_HOST:?set API_HOST in deploy/.env}
      JWT_AUDIENCE: accesscore
      DEMO_ACCOUNT_EMAIL: ${DEMO_ACCOUNT_EMAIL:-}
    expose: ['3000']
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    mem_limit: 512m
    logging: *logging
    networks:
      internal:
        aliases: [accesscore-api]
      edge: {}
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.accesscore-api.rule=Host(`${API_HOST}`) && !PathPrefix(`/metrics`)
      - traefik.http.routers.accesscore-api.entrypoints=websecure
      - traefik.http.routers.accesscore-api.tls.certresolver=le
      - traefik.http.services.accesscore-api.loadbalancer.server.port=3000

  console:
    image: ghcr.io/diegowritescode/accesscore-console:${ACCESSCORE_IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      ACCESSCORE_API_URL: http://accesscore-api:3000
    expose: ['3001']
    mem_limit: 256m
    logging: *logging
    networks: [internal, edge]
    labels:
      - traefik.enable=true
      - traefik.docker.network=edge
      - traefik.http.routers.accesscore-console.rule=Host(`${CONSOLE_HOST:?set CONSOLE_HOST in deploy/.env}`)
      - traefik.http.routers.accesscore-console.entrypoints=websecure
      - traefik.http.routers.accesscore-console.tls.certresolver=le
      - traefik.http.services.accesscore-console.loadbalancer.server.port=3001

networks:
  internal:
  edge:
    external: true
    name: edge

volumes:
  pgdata:
  redisdata:
